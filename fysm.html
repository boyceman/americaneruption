var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);
scene.fog = new THREE.Fog(0x0d0d0d, 2200, 4200);
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
var camera = new THREE.PerspectiveCamera(60, 1, 1, 8000);

function toThree(x, y, z){ return new THREE.Vector3(x, z, -y); }

function buildGeom(flat){
  var g = new THREE.BufferGeometry();
  var pos = new Float32Array(flat.length);
  for (var i = 0; i < flat.length; i += 3){
    pos[i] = flat[i]; pos[i+1] = flat[i+2]; pos[i+2] = -flat[i+1];
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

var hemi = new THREE.HemisphereLight(0xf2efe6, 0x1a1a14, 0.75);
scene.add(hemi);
var dir = new THREE.DirectionalLight(0xffffff, 0.7);
dir.position.set(600, 1200, 400);
scene.add(dir);

var worldMat = new THREE.MeshLambertMaterial({color: 0x8a8578, side: THREE.DoubleSide, transparent: true, opacity: 0.22, depthWrite: false});
scene.add(new THREE.Mesh(buildGeom(MAP.world), worldMat));

var pillarMat = new THREE.MeshLambertMaterial({color: 0xded4a2, side: THREE.DoubleSide});
var pillars = [];
MAP.pillars.forEach(function(p){
  var mesh = new THREE.Mesh(buildGeom(p.tris), pillarMat);
  var base = toThree(p.origin[0], p.origin[1], p.origin[2]);
  mesh.position.copy(base);
  scene.add(mesh);
  pillars.push({mesh: mesh, baseY: base.y, travel: p.travel, speed: p.speed,
    state: 'down', t: Math.random()*6, y: 0});
});

var doorMat = new THREE.MeshLambertMaterial({color: 0x4fb0a5, side: THREE.DoubleSide});
MAP.doors.forEach(function(d){
  var mesh = new THREE.Mesh(buildGeom(d.tris), doorMat);
  mesh.position.copy(toThree(d.origin[0], d.origin[1], d.origin[2]));
  scene.add(mesh);
});

var fanMesh = null;
if (MAP.fan){
  fanMesh = new THREE.Mesh(buildGeom(MAP.fan.tris), new THREE.MeshLambertMaterial({color: 0xb0483f, side: THREE.DoubleSide}));
  fanMesh.position.copy(toThree(MAP.fan.origin[0], MAP.fan.origin[1], MAP.fan.origin[2]));
  scene.add(fanMesh);
}

function marker(pos, color, r){
  var m = new THREE.Mesh(new THREE.SphereGeometry(r || 14, 12, 10),
    new THREE.MeshLambertMaterial({color: color, emissive: color, emissiveIntensity: 0.45}));
  m.position.copy(toThree(pos[0], pos[1], pos[2]));
  scene.add(m);
  return m;
}
MAP.tspawns.forEach(function(p){ marker(p, 0xe24b4a); });
MAP.ctspawns.forEach(function(p){ marker(p, 0x378add); });
MAP.guns.forEach(function(p){ marker(p, 0xffd447, 20); });

var padGroup = new THREE.Group();
var padMat = new THREE.MeshBasicMaterial({color: 0x7fdc6a, transparent: true, opacity: 0.35, side: THREE.DoubleSide});
MAP.pads.forEach(function(p){
  var w = p.max[0]-p.min[0], d = p.max[1]-p.min[1];
  var geo = new THREE.PlaneGeometry(w, d);
  var mesh = new THREE.Mesh(geo, padMat);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.copy(toThree((p.min[0]+p.max[0])/2, (p.min[1]+p.max[1])/2, p.min[2]+2));
  padGroup.add(mesh);
});
padGroup.visible = false;
scene.add(padGroup);

var center = new THREE.Vector3(418, 120, 418);
var sph = {r: 1500, theta: Math.PI*0.75, phi: Math.PI/3.2};
var defaults = {r: sph.r, theta: sph.theta, phi: sph.phi};
function applyCam(){
  camera.position.set(
    center.x + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta),
    center.y + sph.r*Math.cos(sph.phi),
    center.z + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta));
  camera.lookAt(center);
}
var dragging = false, panning = false, px = 0, py = 0;
canvas.addEventListener('mousedown', function(e){ dragging = true; panning = e.shiftKey || e.button === 2; px = e.clientX; py = e.clientY; });
window.addEventListener('mouseup', function(){ dragging = false; });
window.addEventListener('mousemove', function(e){
  if (!dragging) return;
  var dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (panning){
    var right = new THREE.Vector3().subVectors(camera.position, center).cross(camera.up).normalize();
    var up = camera.up.clone();
    center.addScaledVector(right, dx * sph.r * 0.0012);
    center.addScaledVector(up, dy * sph.r * 0.0012);
  } else {
    sph.theta -= dx * 0.005;
    sph.phi = Math.min(Math.PI - 0.05, Math.max(0.05, sph.phi - dy * 0.005));
  }
  applyCam();
});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  sph.r = Math.min(5000, Math.max(200, sph.r * (e.deltaY > 0 ? 1.1 : 0.9)));
  applyCam();
}, {passive: false});
var touches = {};
canvas.addEventListener('touchstart', function(e){
  for (var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i]; touches[t.identifier]={x:t.clientX,y:t.clientY}; }
}, {passive: true});
canvas.addEventListener('touchmove', function(e){
  var ids = Object.keys(touches);
  if (ids.length === 1 && e.touches.length === 1){
    var t = e.touches[0], prev = touches[t.identifier];
    if (prev){
      sph.theta -= (t.clientX - prev.x) * 0.006;
      sph.phi = Math.min(Math.PI - 0.05, Math.max(0.05, sph.phi - (t.clientY - prev.y) * 0.006));
      touches[t.identifier] = {x: t.clientX, y: t.clientY};
      applyCam();
    }
  } else if (e.touches.length === 2){
    var a = e.touches[0], b = e.touches[1];
    var d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (canvas._pd){ sph.r = Math.min(5000, Math.max(200, sph.r * canvas._pd / d)); applyCam(); }
    canvas._pd = d;
  }
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('touchend', function(e){
  for (var i=0;i<e.changedTouches.length;i++){ delete touches[e.changedTouches[i].identifier]; }
  canvas._pd = null;
}, {passive: true});

var mode = 'live';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) mode = 'up';
function setMode(m){
  mode = m;
  document.getElementById('btnLive').classList.toggle('on', m === 'live');
  document.getElementById('btnUp').classList.toggle('on', m === 'up');
  document.getElementById('btnDown').classList.toggle('on', m === 'down');
}
document.getElementById('btnLive').onclick = function(){ setMode('live'); };
document.getElementById('btnUp').onclick = function(){ setMode('up'); };
document.getElementById('btnDown').onclick = function(){ setMode('down'); };
setMode(mode);
document.getElementById('btnPads').onclick = function(){
  padGroup.visible = !padGroup.visible;
  this.classList.toggle('on', padGroup.visible);
};
document.getElementById('btnTop').onclick = function(){ sph.phi = 0.06; sph.theta = Math.PI/2; applyCam(); };
document.getElementById('btnReset').onclick = function(){ sph.r = defaults.r; sph.theta = defaults.theta; sph.phi = defaults.phi; center.set(418,120,418); applyCam(); };

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize(); applyCam();

var last = performance.now();
function tick(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  pillars.forEach(function(p){
    var upSpd = p.speed * dt;
    if (mode === 'up'){ p.y = Math.min(p.travel, p.y + upSpd * 3); }
    else if (mode === 'down'){ p.y = Math.max(0, p.y - upSpd * 3); }
    else {
      p.t -= dt;
      if (p.state === 'down' && p.t <= 0){ p.state = 'rising'; }
      else if (p.state === 'rising'){
        p.y += upSpd;
        if (p.y >= p.travel){ p.y = p.travel; p.state = 'upwait'; p.t = 1 + Math.random()*1.5; }
      }
      else if (p.state === 'upwait' && p.t <= 0){ p.state = 'falling'; }
      else if (p.state === 'falling'){
        p.y -= upSpd;
        if (p.y <= 0){ p.y = 0; p.state = 'down'; p.t = 1 + Math.random()*9; }
      }
    }
    p.mesh.position.y = p.baseY + p.y;
  });
  if (fanMesh && !reduced) fanMesh.rotation.y += dt * 2.2;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
